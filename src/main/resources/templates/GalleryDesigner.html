<script>
	function convertTableToJSON() {
		var list_div = document.getElementById('myTable'); // Replace 'myTable' with the ID of your HTML table
		var rows = list_div.getElementsByTagName('li');
		var jsonData = [];
		var temp = '';
		debugger;
		var rowData = [];
		// Iterate through each row of the table
		for (var i = 0; i < rows.length; i++) { // Start from 1 to skip the table header
			var cells = rows[i].getElementsByTagName('td');
			var columnValue = document.getElementById('id-' + i).value; // Assumes the first row contains column headers
			rowData[i] = btoa(columnValue);
		}
		temp = rowData.join(',');
		jsonData.push(temp);
		var json = '[' + jsonData + ']';
		document.getElementById("jsonString").value = JSON.stringify(json,
				null, 2);
		jsonData = [];
		for (var i = 0; i < rows.length; i++) { // Start from 1 to skip the table header
			var cells = rows[i].getElementsByTagName('td');
			var columnValue = document.getElementById('id-link-' + i).value; // Assumes the first row contains column headers
			if (columnValue == null || columnValue == '')
				columnValue = '#';
			rowData[i] = "'" + btoa(columnValue) + "'";
		}
		temp = rowData.join(',');
		jsonData.push(temp);
		var json = '[' + jsonData + ']';
		document.getElementById("linksString").value = JSON.stringify(json,
				null, 2);

		document.forms[2].submit();
	}
</script>

		<script>
  function handleDragStart(event) {
    event.dataTransfer.setData('text/plain', null);
    event.target.classList.add('dragging');
  }

  function handleDragOver(event) {
    event.preventDefault();
  }

  function handleDrop(event) {
	    event.preventDefault();
	    const dragged = document.querySelector('.dragging');
	    const target = event.target.closest('.draggable');

	    if (dragged && target && dragged !== target) {
	        const parent = target.parentNode;
	        const draggedIndex = Array.from(parent.children).indexOf(dragged);
	        const targetIndex = Array.from(parent.children).indexOf(target);

	        if (draggedIndex < targetIndex) {
	            parent.insertBefore(dragged, target.nextSibling);
	        } else {
	            parent.insertBefore(dragged, target);
	        }
	        updateOrder();
	    }

	    if (dragged) {
	        dragged.classList.remove('dragging');
	    }
	}


  function updateOrder() {
    const rows = document.querySelectorAll('#selectedItems .draggable');
    const ids = Array.from(rows).map((row, index) => {
      row.setAttribute('data-index', index);
      return index;
    });
  }

  document.addEventListener('DOMContentLoaded', function () {
	    const draggableRows = document.querySelectorAll('#selectedItems .draggable');
	    draggableRows.forEach(row => {
	        row.addEventListener('dragstart', handleDragStart);
	        row.addEventListener('dragover', handleDragOver);
	        row.addEventListener('drop', handleDrop);
	    });
	});
</script>

<script>
	// create the back to top button
	$('body').prepend('<a href="#" class="back-to-top">Back to Top</a>');

	var amountScrolled = 300;

	$(window).scroll(function() {
		if ($(window).scrollTop() > amountScrolled) {
			$('a.back-to-top').fadeIn('slow');
		} else {
			$('a.back-to-top').fadeOut('slow');
		}
	});

	$('a.back-to-top, a.simple-back-to-top').click(function() {
		$('html, body').animate({
			scrollTop : 0
		}, 700);
		return false;
	});
</script>

<script>
    function shuffleCarousel() {
      const carouselInner = document.querySelector('.random-slides');
      if (!carouselInner) return;
      const slides = Array.from(carouselInner.children);

      for (let i = slides.length - 1; i > 0; i--) {
        const randomIndex = Math.floor(Math.random() * (i + 1));
        [slides[i], slides[randomIndex]] = [slides[randomIndex], slides[i]];
      }

      slides.forEach((slide, index) => {
        if (index === 0) {
          slide.classList.add('active');
        } else {
          slide.classList.remove('active');
        }
        carouselInner.appendChild(slide);
      });
    }

    window.addEventListener('DOMContentLoaded', shuffleCarousel);
  </script>

	<script>
		function lists(typeGiven) {
			document.getElementById("viewGroups").innerHTML = '';
			document.getElementById("viewItems").innerHTML = '';
			id = "viewGroups";
			var type = {
				'type' : typeGiven
			};
			select = document.getElementById("viewGroups");
			var csrfToken = $('meta[name="_csrf"]').attr('content');
			var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
			$
					.ajax({
						type : "POST",
						url : "/getGalleryGroups",
						data : JSON.stringify(type),
						dataType : 'json',
						beforeSend : function(xhr) {
							xhr.setRequestHeader(csrfHeader, csrfToken);
						},
						headers : {
							'X-CSRF-TOKEN' : csrfToken,
							'X-XSRF-HEADER' : csrfHeader
						},
						contentType : "application/json",
						success : function(data) {
							var typeChar = "";
							if (typeGiven == '2')
								typeChar = 'image';
							else if (typeGiven == '7')
								typeChar = 'video';
							else if (typeGiven == '8')
								typeChar = 'audio';
							else if (typeGiven == '9')
								typeChar = 'doc';
							else if (typeGiven == '11')
								typeChar = 'cards';
							else if (typeGiven == '12')
								typeChar = 'navtabs';
							var demo = "<span class=\"fa-layers fa-fw fa-5x m-3\" onClick=\"location.href='"+ typeChar + "'\"> <i class=\"fas fa-circle\"	style=\"color: black\"></i> <i class=\"fas fa-circle\"						data-fa-transform=\"shrink-3\" style=\"color: Tomato\"></i> <i						class=\"fa-inverse fas fa-plus\" data-fa-transform=\"shrink-6\"></i>					</span>";
							var bold = document.createElement("b");
							bold.innerText = "Add";
							var option = document.createElement("i");
							option.classList.add("col-2", "text-center", "fas",
									"fa-circle-plus", "fa-4x", "my-auto");
							// 					demo.setAttribute("onClick", "location.href='"
							// 							+ typeGiven + "'");
							select.innerHTML = demo;
							// 					select.appendChild(bold);

							for (let i = 0; i < data.length; i++) {
								var option = document.createElement("div");
								option.classList.add("col-2", "p-3",
										"text-center");

								option.setAttribute("onClick", "viewGallery('"
										+ data[i].group_id + "','" + typeGiven
										+ "')");
								var bold = document.createElement("b");
								bold.innerText = data[i].group_id;
								var folder = document.createElement("i");
								folder.classList.add("fas", "fa-folder",
										"fa-4x", "d-block", "mx-auto");
								option.appendChild(folder);
								option.appendChild(bold);
								select.appendChild(option);
							}
						},
						error : function(xhr, textStatus, errorThrown) {
							if (xhr.status == 405) {
								alert("Not a valid request. Please try again");
								window.location.reload();
							}
						}
					});
		}
	</script>
	<script>
		function viewGallery(groupName, typeGiven) {
			document.getElementById("viewItems").innerHTML = '';
			id = "viewItems";
			var type = {
				'group' : groupName,
				'type' : typeGiven
			};
			select = document.getElementById("viewItems");

			var container = document.createElement("div");
			container.classList.add("container");

			var row = document.createElement("div");
			row.classList.add("row");
			var csrfToken = $('meta[name="_csrf"]').attr('content');
			var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
			$.ajax({
						type : "POST",
						url : "/getGalleryItems",
						beforeSend : function(xhr) {
							xhr.setRequestHeader(csrfHeader, csrfToken);
						},
						headers : {
							'X-CSRF-TOKEN' : csrfToken,
							'X-XSRF-HEADER' : csrfHeader
						},
						data : JSON.stringify(type),
						dataType : 'json',
						contentType : "application/json",
						success : function(data) {
							for (let i = 0; i < data.length; i++) {
								debugger;
								var option;

								if (typeGiven == '2') {
									option = document.createElement("img");
									option.setAttribute(
													"src",
													"static/gallery/"
													+ "image"
													+ "/"
													+ data[i].thumbnail_filename);
										//"/getImg/" + data[i].thumbnail_filename);

								} else if (typeGiven == '7' || typeGiven == '8') {
									var typeChar = '';
									//var ssr = '';
									if (typeGiven == 7){
										typeChar = 'video';
										//ssr = '/getVedio/';
									}else if (typeGiven == 8){
										typeChar = 'audio';
										//ssr = '/getAudio/';
									}
									option = document.createElement(typeChar);
									option.setAttribute("controls", "");
									option.setAttribute("width", "100%");
									option.setAttribute("height", "100%");
									let source = document
											.createElement("source");
									source.setAttribute(
													"src",
													"static/gallery/"
													+ typeChar
													+ "/"
													+ data[i].thumbnail_filename);
									//"images/" + data[i].thumbnail_filename + "/" + typeGiven);
									 //+ ssr + data[i].thumbnail_filename);
									source.setAttribute("type", typeChar
											+ "/mp4");
									option.appendChild(source);
									console.log(option);
								} else if (typeGiven == '9') {
									option = document.createElement("a");
									option.setAttribute(
													"href",
													"static/gallery/docs/" + data[i].thumbnail_filename);
											//"images/" + data[i].thumbnail_filename + "/" + typeGiven);
											//"/getDoc/" + data[i].thumbnail_filename);
									option.innerText = data[i].description;
									option.classList.add("d-block", "border",
											"border-1");

								}
								// 								if (i == 0) {
								// 									var col = document.createElement("div");
								// 									col.appendChild(option);
								// 									row.appendChild(col);
								// 								}
								var col = document.createElement("div");
								col.classList.add("col-2");

								var card = document.createElement("div");
								card.classList.add("card");

								var cardHeader = document.createElement("div");
								cardHeader.classList.add("card-header");

								var closeButton = document
										.createElement("button");
								closeButton.classList.add("btn", "btn-sm",
										"float-end");
								closeButton.innerHTML = '<i class="fas fa-times"></i>';

								closeButton.addEventListener("click",
										(function(clickedCard) {
											return function() {
												clickedCard.remove();
											};
										})(card));

								var cardBody = document.createElement("div");
								cardBody.classList.add("card-body",
										"text-center");
								cardBody.setAttribute("style",
										"overflow:hidden;");
								let para = document.createElement("div");
								para.innerText = data[i].original_filename;

								var cardFooter = document.createElement("div");
								cardFooter.classList.add("card-footer");
								var iconsLeft = document.createElement("div");
								iconsLeft.classList.add("icons-left");

								var iconT = document.createElement("i");
								iconT.classList.add("fas", "fa-t", "p-1",
										"border", "fa-fw", "fa-2xs", "rounded",
										"text-white", "bg-primary");
								iconT
										.setAttribute('onclick',
												'showTitle(this)');
								iconT.setAttribute('title', 'Title');
								iconsLeft.appendChild(iconT);

								var iconD = document.createElement("i");
								/* iconD.classList.add("fas", "fa-d","p-1", "border", "border-2", "rounded-circle", "border-secondary"); */
								iconD.classList.add("fas", "fa-d", "p-1",
										"border", "fa-fw", "fa-2xs", "rounded",
										"bg-warning");
								iconD.setAttribute('onclick',
										'showDescription(this)');
								iconD.setAttribute('title', 'Description');
								iconsLeft.appendChild(iconD);

								var iconS = document.createElement("i");
								iconS.classList.add("fas", "fa-s", "p-1",
										"border", "fa-fw", "fa-2xs", "rounded",
										"text-white", "bg-success");
								iconS
										.setAttribute('onclick',
												'showStyle(this)');
								iconS.setAttribute('title', 'Style');
								iconsLeft.appendChild(iconS);

								var iconCaretDown = document.createElement("i");
								iconCaretDown.classList.add("fas", "fa-bars",
										"p-1", "border", "fa-fw", "fa-2xs",
										"rounded", "text-white", "bg-info");
								iconCaretDown.setAttribute('onclick',
										'showMore(this)');
								iconCaretDown.setAttribute('title', 'More');

								cardFooter.appendChild(iconsLeft);
								cardFooter.appendChild(iconCaretDown);

								cardHeader.appendChild(closeButton);

								card.appendChild(cardHeader);
								card.appendChild(cardBody);
								cardBody.appendChild(option);
								cardBody.appendChild(para);
								card.appendChild(cardFooter);

								col.appendChild(card);
								row.appendChild(col);
								// 						option.setAttribute("onClick", "viewGallery('"
								// 								+ data[i][0] + "')");

								// 						option.appendChild(para);
								container.appendChild(row);
								select.appendChild(container);
								/* select.appendChild(para); */

							}
							// 					document.getElementById("viewItems").append(select);
						}
					});
		}
	</script>
	<script>
		$(document).ready(function() {
			$('.folder-header').click(function() {
				var $icon = $(this).find('i');
				var $folderItems = $(this).siblings('.folder-items');
				var $folder = $(this).parent();

				$folderItems.slideToggle();
				$icon.toggleClass('fa-angle-down fa-angle-up');
				$folder.toggleClass('collapsed expanded');
			});
		});
	</script>

.slider {

	left: 0;

	-webkit-transition: .4s;
	transition: .4s;

	left: 2px;
	bottom: 2px;
	background-color: white;
	-webkit-transition: .4s;

<script>
	function deletePage(page_id, el) {
		var cnfrm = confirm("Are you sure of deleting this Page?");
		if (cnfrm) {
			var type = {
				'page_id': page_id
			};
			$.ajax({
				type: "POST",
				url: "/deletePage",
				data: JSON.stringify(type),
				dataType: 'text',
				headers: {
                        'X-XSRF-TOKEN': document.getElementById("csrf_token").value						
                   },
				contentType: "application/json",
				success: function (data) {
					debugger;
					$(el).parent().parent().remove();
					alert("Removed Successfully");
					location.reload();
				},
					error:function(xhr,textStatus,errorThrown){
						if(xhr.status==405){
							alert("Not a valid request. Please try again");
							window.location.reload();
							}
					}
			});
		}
	}
	function editable() {
		var mainContent = document.getElementById('page'); // Replace 'myTable' with the ID of your HTML table
		debugger;
		var spans = mainContent.getElementsByTagName('span');
		console.log(spans);

		for (i = 1; i <= spans.length; i++) {
			let spanClose = document.createElement('i');
			spanClose.setAttribute("onClick", "getid(this);");
			spanClose.setAttribute("data-bs-target", "#selectionPopup");
			spanClose.setAttribute("data-bs-toggle", "modal");
			spanClose.setAttribute("style", "cursor:pointer;");
			spanClose.innerText = '';
			spanClose.classList.add("text-right", "bg-danger", "border",
				"border-danger", "p-1", "text-white", "far", "fa-2xl",
				"fa-circle-xmark");
			document.getElementById("s" + i).insertBefore(spanClose,
			document.getElementById("s" + i).firstChild);
		}
	}

		var id = $(e).parent().attr('id');
		document.getElementById("plusign_id").value = id;

	}

	function changeItem(id) {
		let bool = confirm("Are you sure of updating the Page");
		if (!bool)
			return null;
		var type = {
			'id': id,
			'value': document.getElementById(id).value,
			'page_id': document.getElementById("page_id_selected").value
		};
		$.ajax({
			type: "POST",
			url: "/updateItem",
			data: JSON.stringify(type),
			// 			dataType : 'json',
			contentType: "application/json",
			headers: {
                        'X-XSRF-TOKEN': document.getElementById("csrf_token").value						
                   },
			success: function (data) {
				debugger;
				const newItem = document.createElement('span');
				newItem.innerHTML = data;
				document.getElementById(id).parentNode.replaceChild(newItem,
					document.getElementById(id));
			},
			error: function (request, error) {
				alert(error);
			}
		});
	}

<script>
	function edit(el) {
		debugger;
		let id = $(el).parent().parent();
		let id_selected = $(el).parent().attr('id');
		console.log($(el).parent());
		console.log($(el).parent().parent());

		$(el).parent().remove();

		let select = document.createElement("select");
		select.setAttribute("id", id_selected);
		select.classList.add("form-select");
		$.ajax({
			type: "GET",
			url: "/getObjects",
			success: function (data) {
				var option = document.createElement("option");
				select.setAttribute("onChange", "changeItem('" + id_selected
					+ "')");
				option.value = "";
				option.text = "--Select--";
				select.appendChild(option);
				for (let i = 0; i < data.length; i++) {

					var option = document.createElement("option");
					select.setAttribute("onChange", "changeItem('"
						+ id_selected + "')");
					option.value = data[i].object_id;
					option.text = data[i].name;
					select.appendChild(option);
				}
				id.append(select);
			}
		});
	}
</script>

		<script>
		function publish(el) {
			var checked = el.checked;
			var value = el.value;
			if (checked) {
				showMessageBox('warning');
				document.getElementById('messageBoxText').innerHTML = 'Are you sure of Publishing this Page?';

				$('#messageBoxConfirmBtn').click(function () {

					$.ajax({
						type: "POST",
						url: "/publishPage?page_id=" + value,
						dataType: 'text',
						headers: {
                        'X-XSRF-TOKEN': document.getElementById("csrf_token").value						
                   },
						contentType: "application/json",
						success: function (data) {
							location.reload();
						},
					error:function(xhr,textStatus,errorThrown){
						if(xhr.status==405){
							alert("Not a valid request. Please try again");
							window.location.reload();
							}
					}
					});

				});
			}
		}
	</script>
		<script>
		function searchBar() {
			debugger;
			const searchBar = document.getElementById("searchBarInput");
			const searchQuery = searchBar.value.toLowerCase();
			const divs = document.querySelectorAll('.col-6'); // Replace '.item' with the actual class/attribute of your divs

			divs.forEach(div => {
				const content = div.textContent.toLowerCase();
				if (content.includes(searchQuery)) {
					div.style.display = 'block';
				} else {
					div.style.display = 'none';
				}
			});
		}
	</script>
		<script> 
        $(document).ready(function () { 
            $('.dropdown').hover(function () { 
                $(this).addClass('show'); 
                $(this).find('.dropdown-menu').addClass('show'); 
            }, function () { 
                $(this).removeClass('show'); 
                $(this).find('.dropdown-menu').removeClass('show'); 
            }); 
        }); 
    </script>

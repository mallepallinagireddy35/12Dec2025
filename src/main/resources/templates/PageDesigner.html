<style>
.templateBox {

	overflow: hidden;

	$(function() {
		//	$("#includeHeader").load("header.html");

<style>
/* Custom styles for draggable popup */
.modal-dialog {
	width: 90vh !important;
	/* Set the desired width */
	height: 70vh !important;
	/* Set the desired height */
	margin: 0 auto;
}

.ui-widget-content {
	box-sizing: content-box !important;
}

/* Custom styles for modal footer */
.modal-footer {
	justify-content: space-between;
	align-items: right;
}

	text-align: left;
}

	padding-top: 3px;
	padding-bottom: 3px;

<body>
	<div class="flex-wrapper">
		<div id="includeHeader" th:replace="~{header.html::header}"></div>
		<div id="includeMsgBox"></div>
		<div class="container">
			<form th:action="@{/designPage}" method="get">
				<div class="row mt-5">
					<div class="col-4">
						<label for="page_name">Name of the Page</label> 
						<input type="text" id="page_name_given" name="page_name" th:value="${page_name}"
							onBlur="nameChanged()" required="true" autocomplete="off"
							class="form-control">
					</div>
					<div class="col-3">
						<label for="pages">Select Template type:</label> 
						<select class="form-select" id="template_id" name="template_id">
							<option value="-1">Select option</option>
							<option th:each="option : ${options}"
								th:value="${option.template_id}"
								th:selected="${template_id==option[0]}"
								th:text="${option.template_name}"></option>
						</select>
					</div>
					<div class="col-4 mt-4">
						<button type="submit" class="btn btn-primary">Design Page</button>
					</div>
				</div>
			</form>
			<div class="card mt-5" id="designTable">
				<div class="card-header bg-primary text-white text-center">Items
					in the page</div>
				<div class="card-body" style="overflow-x: scroll;">
					<p class="text-body-secondary">Select items from the below.
						Page will be created with items in the same order selected below</p>
					<form th:action="@{/savePage}" method="post">
						<input type="hidden" id="csrf_token"
							th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> <label></label>
						<div id="myTable">
							<div th:each="row, rowStat : ${page_items}"></div>
							<input type="hidden" class="form-control"  name="page_name" id="page_name_new" th:value="${page_name}"> 
							<input type="hidden"  name="page_id" id="page_idOld" th:value="${page_id}">
						</div>
					</form>
					<div th:utext="${templateBody}" id="mainContainer"></div>
					<input type="hidden" id="plusign_id" />
				</div>
				<form th:action="@{/savePage}" method="post">
					<input type="hidden" id="csrf_token" th:name="${_csrf.parameterName}" th:value="${_csrf.token}" /> 
					<input type="text" id="description" name="description"
						placeholder="Description of the Page" th:value="${description}"
						required="true" autocomplete="off" class="form-control"> 
						<input type="text" id="keywords" name="keywords" th:value="${keywords}" required="true" autocomplete="off" placeholder="Keywords" class="form-control"> 
						<input type="hidden" name="jsonString" id="jsonString"> 
						<input type="hidden" name="existingJson" id="existingJson" th:value="${existingJson}">
					    <input type="hidden" name="page_name" id="page_name" th:value="${page_name}"> 
						<input type="hidden" name="template_id" id="template_id" th:value="${template_id}">
					    <input type="hidden" name="page_id" id="page_id" th:value="${page_id}"> 
					    <input type="button" value="Submit" class="btn btn-primary" onClick="convertJSON()">
				</form>
			</div>
		</div>

		<div class="modal fade" id="selectionPopup" data-bs-backdrop="static"
			data-bs-keyboard="false" tabindex="-1"
			aria-labelledby="selectionPopupLabel" aria-hidden="true">
			<div class="modal-dialog modal-lg">
				<div class="modal-content">
					<div class="modal-header">
						<h1 class="modal-title fs-5" id="selectionPopupLabel">Select

						<button type="button" class="btn-close" data-bs-dismiss="modal"

					</div>
					<div class="modal-body">
						<div id="includeObjSelector"></div>
					</div>
					<div class="modal-footer">
						<div id="selectedCount">0 items selected</div>
						<div>
							<label class="switch"> <input type="checkbox"
								id="toggleSelection"> <span class="slider round"></span>
							</label> <span id="toggleLabel">Selection Mode</span>
						</div>
						<div>
							<button type="button" class="btn btn-primary btn-sm">Select</button>
							<button type="button" class="btn btn-warning btn-sm"
								data-bs-dismiss="modal">Close</button>
						</div>
					</div>
				</div>
			</div>
		</div>
		<!-- <div id="includeFooter">-->
	</div>

	}

<script>
	$('.modal-dialog').draggable({
		handle : ".modal-header"
	});
	$(document).ready(function() {
		// Initialize the selected count
		var selectedCount = 0;
		updateSelectedCount();

		// Event listener for navigation button clicks
		$('#navigationButtons button').click(function() {
			var cardId = $(this).data('card');
			$('.selectObj').hide();
			$('#' + cardId).show();
		});

		// Event listener for checkbox changes
		$('input[type="checkbox"]').change(function() {
			updateSelectedCount();
		});

		// Update the selected count
		function updateSelectedCount() {
			selectedCount = $('input[type="checkbox"]:checked').length;
			$('#selectedCount').text(selectedCount + ' items selected');
		}
	});

	//var selectionMode = false; // true for selection mode, false for display mode

	function selectItems() {
		var selectedCount = $('input[type="checkbox"]:checked').length;
		if (selectedCount === 0) {
			showAlertBox('info');
			$('#messageBoxText').text("Please select atleast one item");
		} else {
			showAlertBox('success');
			$('#messageBoxText').text(
					'Selected ' + selectedCount
							+ ' Items and will be added to the page');
			closePopup();
			closePopup();
			// Handle selection logic here
			// ...

			// Toggle between selection mode and display mode
			//    selectionMode = !selectionMode;
			//updatecardContent();
		}
	}
	$(document).ready(function() {
		$('.item').click(function() {
			$(this).toggleClass('selected');
			selectedCount++;
			updateSelectedCount();
		});
	});
</script>

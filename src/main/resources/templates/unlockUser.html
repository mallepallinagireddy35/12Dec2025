<script>
	function handleLockIconClick(icon) {
		event.preventDefault();
		const username = icon.querySelector('.hidden-username').textContent.trim();
		const selectedCheckbox = icon.closest('tr').querySelector('.form-check-input:checked');

		if (!selectedCheckbox) {
			alert("Please Check the CheckBox before you select the Lock/Unlock Icon!!");
			return;
		}

		const isLocked = icon.classList.contains('fa-lock');
		const toast = new bootstrap.Toast(document.querySelector('.toast'));
		// Get the CSRF token value

		// alert(csrfToken);
					

		var csrfToken = $("meta[name='_csrf']").attr("content");
		var csrfHeader = $("meta[name='_csrf_header']").attr("content");
		$.ajax({
			type: 'POST',
			url: '/unlock-user',
			contentType: 'application/json', // Corrected property name
			data: JSON.stringify({
				username: username,
				isLocked: isLocked
			}), 
			/*data: JSON.stringify(params),  */
			// Convert data to JSON string
			beforeSend: function (xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers: {
				'X-CSRF-TOKEN': csrfToken,
				'X-XSRF-HEADER': csrfHeader
			},
			success: function (response) {
				// Handle success response
				toast.show();
				icon.classList.toggle('fa-lock');
				icon.classList.toggle('fa-unlock');
				displayResponseModal(response); // Show the response message in the modal
			},
			error: function (error) {
				// Handle error response
			}
		});






	}

	function displayResponseModal(message) {
		const responseMessage = document.getElementById('responseMessage');
		responseMessage.textContent = message;

		const modal = new bootstrap.Modal(document.getElementById('responseModal'));
		modal.show();
	}
</script>

</head>

<body>	<div class="flex-wrapper">

	<div id="includeHeader" th:replace="~{header.html::header}"></div>

<script>
	document.addEventListener('DOMContentLoaded', function () {
		const lockIcons = document.querySelectorAll('.custom-lock');

		lockIcons.forEach(icon => {
			const username = icon.parentElement.querySelector('.username').textContent;
			icon.setAttribute('data-username', username);
		});
	});
</script>

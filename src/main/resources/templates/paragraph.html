		<script>
			async
			function printIt() {
				event.preventDefault();
				var msg = CKEDITOR.instances.editor.getData();

					alert("Please enter content");
					return false;
				}
				if (document.getElementById("text") == '') {
					alert("Please enter Title");
					return false;
				}
				debugger;
				document.getElementById("jsonString").value = '\"[' + encodeURIComponent(msg) + ']\"';
				var msg_hi = CKEDITOR.instances['editor_hi'].getData();
				document.getElementById("jsonString_hi").value = '\"[' + encodeURIComponent(msg_hi) + ']\"';
				console.log(document.getElementById("jsonString_hi").value);
				debugger;				
				
				var csrfToken = $('meta[name="_csrf"]').attr('content');
		        var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		    
					var data = {
						 "object_id":document.getElementById('object_id').value,						
						 "imgType":"",				 
						 "jsonString" : document.getElementById('jsonString').value,
						 "type":document.getElementById('type').value,

						 "object_title_hi":document.getElementById('text_hi').value,

						 "jsonString_hi":document.getElementById('jsonString_hi').value,
						 "meta_hi":""
					};
								
					$.ajax({
					type: "POST",
					beforeSend : function(xhr) {
						xhr.setRequestHeader(csrfHeader, csrfToken);
					},
					headers : {
						'X-CSRF-TOKEN' : csrfToken,
						'X-XSRF-HEADER' : csrfHeader
					},
					url: "/save",								
					contentType: "application/json",
					data: JSON.stringify(data),			
					success: function (response) {				
						alert(response.success);
						//return false;		
					},
					error: function (xhr, status, error) {
			            console.error("Error:", error)	            
			            //return false;	        
					}
				});
			}

		<script>
			async	function generateHindi() {
				const warningMessage = "MYMEMORY WARNING: YOU USED ALL AVAILABLE FREE TRANSLATIONS FOR TODAY";
				var englishContent = document.getElementById("text").value;
				if(englishContent === "" || englishContent === null){
					alert("Please Enter Title");
					document.getElementById("text").focus();
					return false;
				}
				document.getElementById('generateHindi').style.display = 'block';
				var msg = CKEDITOR.instances.editor.getData();
				const url = 'https://api.mymemory.translated.net/get';
				
				var params = new URLSearchParams({
					q : englishContent,
					langpair : 'en|hi'
				});
				var response = await fetch(`${url}?${params}`);
				var data = await	response.json();
//---------------------04-09-2025---------------------------------------------------------------
				if (data.responseData.translatedText.startsWith(warningMessage)) {
				   alert("You’ve reached the free translation limit for today. Try again in 24 hours or upgrade the service.");
			       return false;
				}
//----------------------------------------------------------------------------------------------				
				document.getElementById("text_hi").value = data.responseData.translatedText;
				var hindi_meta = {
					"title" : document.getElementById("text_hi").value
				};
				document.getElementById("jsonString").value = '\"['+ encodeURIComponent(msg) + ']\"';
				var text = "";
				/*var msg_array = msg.match(/.{1,450}/g);
				for (var i = 0; i < msg_array.length; i++) {
					var englishContent = msg_array[i].trim();
					var params = new URLSearchParams({

					var response = await	fetch(`${url}?${params}`);
					var data = await	response.json();
					debugger;

					console.log(document.getElementById("editor_hi").value);
				}
			CKEDITOR.instances['editor_hi'].setData(text); */
			
			var msg_array = msg.match(/.{1,450}/g) || [];
			for (var i = 0; i < msg_array.length; i++) {
				var englishContent = msg_array[i].trim();
				if (!englishContent) continue; // skip empty
			
				var params = new URLSearchParams({
					q: englishContent,
					langpair: 'en|hi'
				});
			
				try {
					var response = await fetch(`${url}?${params}`);
					var data = await response.json();
			
					if (data.responseData && data.responseData.translatedText) {
						// Append only if translation exists
						text += data.responseData.translatedText;
						
//--------------------------------------04-09-2025-------------------------------------------					
					// Split text into words
					    let words = text.split(/\s+/);					
					    // Check if the first word is literally "undefined"
					    if (words[0] === "undefined") {
					        words.shift(); // Remove the first word
					    }					
					    // Join back to a string
					    text = words.join(" "); 
					    
					    
					    // Check if it's a rate limit warning
					    if (data.responseData.translatedText.startsWith(warningMessage)) {
					        // Show alert using CKEditor notification (if you're using CKEditor 5)					       
					       /* if (editor.plugins.has('Notification')) {
								alert("2===")
					            editor.execute('undo'); // Optional: undo the translation
					            editor.plugins.get('Notification').showWarning(
					                "You’ve reached the free translation limit for today. Try again in 24 hours or upgrade the service.",
					                { title: 'Translation Limit Reached', namespace: 'translation' }
					            );
					        } else {
					            // Fallback: browser alert
					            alert("You’ve reached the free translation limit for today. Try again in 24 hours or upgrade the service.");
					            return false;
					        }*/
					        alert("You’ve reached the free translation limit for today. Try again in 24 hours or upgrade the service.");
					        return false;
					    } 
					    /*else {
					        // Append translated text as usual
					        CKEDITOR.instances['editor_hi'].setData(text);
					    }*/
//---------------------------------------------------------------------------						
					}
				} catch (err) {
					console.error(`Translation failed at segment ${i}:`, err);
				}
			}
			CKEDITOR.instances['editor_hi'].setData(text);
			}

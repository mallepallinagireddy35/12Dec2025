		<script>
			// CKEditor 5 compatibility layer
			function getEditorContent(instanceName) {
				if (instanceName === 'editor' && window.editor && typeof window.editor.getData === 'function') {
					return window.editor.getData();
				}
				if (instanceName === 'editor_hi' && window.editor_hi && typeof window.editor_hi.getData === 'function') {
					return window.editor_hi.getData();
				}
				if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances && CKEDITOR.instances[instanceName]) {
					return CKEDITOR.instances[instanceName].getData();
				}
				const el = document.getElementById(instanceName);
				return el ? el.value : '';
			}

			function setEditorContent(instanceName, data) {
				if (instanceName === 'editor' && window.editor && typeof window.editor.setData === 'function') {
					window.editor.setData(data);
					return;
				}
				if (instanceName === 'editor_hi' && window.editor_hi && typeof window.editor_hi.setData === 'function') {
					window.editor_hi.setData(data);
					return;
				}
				if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances && CKEDITOR.instances[instanceName]) {
					CKEDITOR.instances[instanceName].setData(data);
					return;
				}
				const el = document.getElementById(instanceName);
				if (el) el.value = data;
			}

			window.CKEDITOR = window.CKEDITOR || {
				instances: {
					get editor() {
						return {
							getData: () => getEditorContent('editor'),
							setData: (d) => setEditorContent('editor', d)
						};
					},
					get editor_hi() {
						return {
							getData: () => getEditorContent('editor_hi'),
							setData: (d) => setEditorContent('editor_hi', d)
						};
					}
				}
			};
		</script>

		<script>
			let targetEditorId = 'editor';
			let dbimDataLoaded = false;
			let dbimResourcesData = null;

			function openDbimModal(editorId) {
				targetEditorId = editorId || 'editor';
				const badge = document.getElementById('targetEditorBadge');
				if (badge) {
					badge.textContent = (targetEditorId === 'editor_hi') ? 'Hindi Editor' : 'English Editor';
				}
				const modalEl = document.getElementById('dbimResourcesModal');
				if (modalEl) {
					const modal = bootstrap.Modal.getOrCreateInstance(modalEl);
					modal.show();
				}
				if (!dbimDataLoaded) {
					loadDbimResources();
				}
			}

			const slugMeta = {
				'banner-images': { title: 'Banner Images', icon: 'fa-images' },
				'contextual-icons': { title: 'Contextual Icons', icon: 'fa-icons' },
				'functional-icons': { title: 'Functional Icons', icon: 'fa-shapes' },
				'persona-illustrations': { title: 'Persona Illustrations', icon: 'fa-user-group' },
				'pm-images': { title: 'PM Images', icon: 'fa-user-tie' }
			};

			function formatSlugTitle(slug) {
				if (slugMeta[slug] && slugMeta[slug].title) return slugMeta[slug].title;
				return slug.split('-').map(w => w.charAt(0).toUpperCase() + w.slice(1)).join(' ');
			}

			function getSlugIcon(slug) {
				if (slugMeta[slug] && slugMeta[slug].icon) return slugMeta[slug].icon;
				return 'fa-folder';
			}

			function escapeHtml(str) {
				if (!str) return '';
				return String(str).replace(/&/g, '&amp;').replace(/</g, '&lt;').replace(/>/g, '&gt;').replace(/"/g, '&quot;').replace(/'/g, '&#039;');
			}

			function escapeJs(str) {
				if (!str) return '';
				return String(str).replace(/\\/g, '\\\\').replace(/'/g, "\\'").replace(/"/g, '\\"');
			}

			async function loadDbimResources() {
				const spinner = document.getElementById('dbimLoadingSpinner');
				if (spinner) spinner.style.display = 'block';

				let data = null;
				// 1. Try endpoint /getDbimResources
				try {
					const res = await fetch('/getDbimResources');
					if (res.ok) {
						const json = await res.json();
						if (json && json.slugs && Object.keys(json.slugs).length > 0) {
							data = json;
						}
					}
				} catch (e) {
					console.warn('Endpoint /getDbimResources not reachable, trying manifest.json directly:', e);
				}

				// 2. Fallback to /static/assets/dbim-resources/manifest.json
				if (!data) {
					try {
						const res = await fetch('/static/assets/dbim-resources/manifest.json');
						if (res.ok) {
							data = await res.json();
						}
					} catch (e) {
						console.error('Failed to load /static/assets/dbim-resources/manifest.json:', e);
					}
				}

				if (!data || !data.slugs) {
					if (spinner) {
						spinner.innerHTML = '<div class="alert alert-danger my-3"><i class="fa fa-triangle-exclamation me-2"></i>Failed to load DBIM resources. Please ensure static files exist under /static/assets/dbim-resources/.</div>';
					}
					return;
				}

				dbimResourcesData = data;
				dbimDataLoaded = true;
				renderDbimTabs(data.slugs);
			}

			function renderDbimTabs(slugs) {
				const navTabs = document.getElementById('dbimNavTabs');
				const tabContent = document.getElementById('dbimTabContent');
				if (!navTabs || !tabContent) return;

				navTabs.innerHTML = '';
				tabContent.innerHTML = '';

				const slugKeys = Object.keys(slugs);
				slugKeys.forEach((slug, index) => {
					const items = slugs[slug] || [];
					const isActive = (index === 0);
					const tabId = 'tab-dbim-' + slug.replace(/[^a-zA-Z0-9_-]/g, '_');
					const paneId = 'pane-dbim-' + slug.replace(/[^a-zA-Z0-9_-]/g, '_');

					// Tab button
					const li = document.createElement('li');
					li.className = 'nav-item';
					li.setAttribute('role', 'presentation');
					li.innerHTML = `
						<button class="nav-link ${isActive ? 'active' : ''}" id="${tabId}" data-bs-toggle="tab" data-bs-target="#${paneId}" type="button" role="tab" aria-controls="${paneId}" aria-selected="${isActive}">
							<i class="fa ${getSlugIcon(slug)} me-1 text-primary"></i> ${formatSlugTitle(slug)}
							<span class="badge bg-secondary-subtle text-dark border ms-1">${items.length}</span>
						</button>
					`;
					navTabs.appendChild(li);

					// Tab pane
					const pane = document.createElement('div');
					pane.className = `tab-pane fade ${isActive ? 'show active' : ''} dbim-tab-pane`;
					pane.id = paneId;
					pane.setAttribute('role', 'tabpanel');
					pane.setAttribute('aria-labelledby', tabId);

					let gridHtml = `<div class="row row-cols-2 row-cols-sm-3 row-cols-md-4 row-cols-lg-6 g-3 dbim-grid" id="grid-${paneId}">`;

					items.forEach(item => {
						const filename = item.filename || '';
						const title = item.title || filename;
						const imgUrl = `/static/assets/dbim-resources/${slug}/${encodeURIComponent(filename)}`;
						const safeTitle = escapeHtml(title);
						const safeFilename = escapeHtml(filename);
						const jsImgUrl = escapeJs(imgUrl);
						const jsTitle = escapeJs(title);

						gridHtml += `
							<div class="col dbim-item-col" data-title="${safeTitle.toLowerCase()}" data-filename="${safeFilename.toLowerCase()}">
								<div class="card h-100 dbim-card shadow-sm" onclick="selectDbimItem('${jsImgUrl}', '${jsTitle}')" title="Click to insert into editor">
									<div class="dbim-img-wrapper">
										<img src="${imgUrl}" loading="lazy" alt="${safeTitle}">
									</div>
									<div class="card-footer-custom">
										<span class="dbim-title" title="${safeTitle}">${safeTitle}</span>
										<button type="button" class="btn btn-outline-primary btn-sm w-100 mt-1 py-0 px-1" style="font-size: 0.72rem;">
											<i class="fa fa-plus me-1"></i>Insert
										</button>
									</div>
								</div>
							</div>
						`;
					});

					gridHtml += '</div>';
					pane.innerHTML = gridHtml;
					tabContent.appendChild(pane);
				});
			}

			function selectDbimItem(imageUrl, altText) {
				insertImageToEditor(targetEditorId || 'editor', imageUrl, altText);
				const modalEl = document.getElementById('dbimResourcesModal');
				if (modalEl) {
					const modal = bootstrap.Modal.getInstance(modalEl);
					if (modal) modal.hide();
				}
			}

			function insertImageToEditor(editorKey, imageUrl, altText) {
				const fullUrl = imageUrl.startsWith('/') ? imageUrl : ('/' + imageUrl);
				const targetInstance = (editorKey === 'editor_hi') ? window.editor_hi : window.editor;

				if (targetInstance) {
					// 1. Try CKEditor 5 insertImage command
					try {
						targetInstance.execute('insertImage', { source: fullUrl, alt: altText || 'DBIM Resource' });
						showInsertionToast(altText || 'Image');
						return;
					} catch (err) {
						console.warn("CKEditor execute insertImage failed, trying model fragment:", err);
					}

					// 2. Try CKEditor 5 model insertion
					try {
						const viewFragment = targetInstance.data.processor.toView(`<p><img src="${fullUrl}" alt="${altText || 'DBIM Resource'}" style="max-width: 100%; height: auto;" /></p>`);
						const modelFragment = targetInstance.data.toModel(viewFragment);
						targetInstance.model.insertContent(modelFragment);
						showInsertionToast(altText || 'Image');
						return;
					} catch (err) {
						console.warn("CKEditor model insertContent failed, trying setData:", err);
					}

					// 3. Fallback: append HTML via setData
					try {
						const cur = targetInstance.getData();
						targetInstance.setData(cur + `<p><img src="${fullUrl}" alt="${altText || 'DBIM Resource'}" style="max-width: 100%; height: auto;" /></p>`);
						showInsertionToast(altText || 'Image');
						return;
					} catch (err) {
						console.error("CKEditor setData failed:", err);
					}
				}

				// Fallback for CKEditor 4 compatibility
				if (typeof CKEDITOR !== 'undefined' && CKEDITOR.instances && CKEDITOR.instances[editorKey]) {
					try {
						CKEDITOR.instances[editorKey].insertHtml(`<img src="${fullUrl}" alt="${altText || 'DBIM Resource'}" style="max-width: 100%; height: auto;" />`);
						showInsertionToast(altText || 'Image');
						return;
					} catch (e) {
						console.warn("CKEDITOR.instances insertHtml failed:", e);
					}
				}

				// Fallback for textarea
				const textarea = document.getElementById(editorKey);
				if (textarea) {
					textarea.value += `<p><img src="${fullUrl}" alt="${altText || 'DBIM Resource'}" style="max-width: 100%; height: auto;" /></p>`;
					showInsertionToast(altText || 'Image');
				}
			}

			function showInsertionToast(name) {
				const toastEl = document.getElementById('dbimSuccessToast');
				if (toastEl) {
					const textEl = document.getElementById('dbimToastText');
					if (textEl) textEl.textContent = `Inserted "${name}" into editor`;
					const toast = bootstrap.Toast.getOrCreateInstance(toastEl, { delay: 3000 });
					toast.show();
				}
			}

			// Search filtering logic
			document.addEventListener('DOMContentLoaded', function() {
				const searchInput = document.getElementById('dbimSearchInput');
				const clearBtn = document.getElementById('dbimSearchClear');

				if (searchInput) {
					searchInput.addEventListener('input', function(e) {
						const query = e.target.value.trim().toLowerCase();
						if (clearBtn) clearBtn.style.display = query ? 'inline-block' : 'none';

						const activePane = document.querySelector('#dbimTabContent .tab-pane.active');
						if (!activePane) return;

						const items = activePane.querySelectorAll('.dbim-item-col');
						let visibleCount = 0;
						items.forEach(col => {
							const title = col.getAttribute('data-title') || '';
							const filename = col.getAttribute('data-filename') || '';
							if (!query || title.includes(query) || filename.includes(query)) {
								col.style.display = '';
								visibleCount++;
							} else {
								col.style.display = 'none';
							}
						});

						let noMatch = activePane.querySelector('.dbim-no-match');
						if (visibleCount === 0 && items.length > 0) {
							if (!noMatch) {
								noMatch = document.createElement('div');
								noMatch.className = 'dbim-no-match col-12 text-center py-4 text-muted';
								noMatch.innerHTML = '<i class="fa fa-search me-1"></i> No matching resources found in this tab.';
								const grid = activePane.querySelector('.dbim-grid');
								if (grid) grid.appendChild(noMatch);
							}
							noMatch.style.display = 'block';
						} else if (noMatch) {
							noMatch.style.display = 'none';
						}
					});
				}

				if (clearBtn) {
					clearBtn.addEventListener('click', function() {
						if (searchInput) {
							searchInput.value = '';
							searchInput.dispatchEvent(new Event('input'));
							searchInput.focus();
						}
					});
				}

				// When tab changes, re-apply search filter
				document.addEventListener('shown.bs.tab', function(e) {
					if (e.target.closest('#dbimNavTabs') && searchInput && searchInput.value) {
						searchInput.dispatchEvent(new Event('input'));
					}
				});
			});
		</script>
	</div>
</body>

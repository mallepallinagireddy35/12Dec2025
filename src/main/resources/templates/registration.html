<script>
	function wordCapital(obj) {
		obj.value = obj.value.toUpperCase();
	}

	function getAudioCaptcha() {
		//var csrfToken = $("input[name='_csrf']").val();
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha/getCaptcha?_csrf=" + csrfToken
					+ "&timestamp=" + uniqueTimestamp,
			dataType : 'json',
			success : function(data, status) {
				var cpt = data.captchaSession;
				$(document).ready(function() {

					for (var i = 0; i < cpt.length; i++) {
						responsiveVoice.speak(cpt[i]);
					}
					if (typeof (data.error) !== 'undefined') {
					}

				});
			},
			error : function(data, status) {
				alert('error1');
			}
		}, new function() {
		})
	}

	function DrawCaptcha() {
	    var csrfToken = $('meta[name="_csrf"]').attr('content');
	    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

	    refreshCaptchaImage(csrfHeader, csrfToken);

	    // Note: We removed the getCaptchaValue function call from here

	    return false;
	}

	


	// Function to refresh the CAPTCHA image
	function refreshCaptchaImage(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (data, status) {
	            var captchaImageSrc = "data:image/jpeg;base64," + data.image; // Assuming data.image contains the Base64-encoded image data
	            document.getElementById('captchaImage').src = captchaImageSrc;

	            // After refreshing the CAPTCHA image, get the CAPTCHA value from the session
	            getCaptchaValue(csrfHeader, csrfToken);
	        },
	        error: function (data, status) {
	            alert('Error while refreshing CAPTCHA image.');
	        }
	    });
	}

	// Function to get the CAPTCHA value from the session
	function getCaptchaValue(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha/getCaptcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (captchaData) {
	            var cpt = captchaData.captchaSession;
	            // Set the value of captcha_security after getting the value
	            document.getElementById('captcha_security').value = cpt;
	            // Wait for the DOM to be fully loaded before setting the value
	            $(document).ready(function () {
	                $('#captcha_security').val(cpt);
	            });
	        },
	        error: function (xhr, status, error) {
	            console.error("Error:", error);
	            alert('Error while fetching CAPTCHA: ' + error);
	        }
	    });
	}

</script>

	<script>
		/* 		function hashPassword(password) {
		 return CryptoJS.SHA256(password).toString();
		 } */

		/* function hashPassword(password) {
			return CryptoJS.SHA256(password).toString();
		} */
		function isPasswordValid(password) {
			// Password pattern: Minimum 8 characters, at least one uppercase, one lowercase, one special character, and one digit
			var passwordPattern = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}$/;
			return passwordPattern.test(password);
		}

		function hashPassword(password) {

			var userPassword = $("#password").val();

			if (!isPasswordValid(userPassword)) {
				$(".password-error")
						.text(
								"Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one special character, and one digit.");
				return;
			}
			var temp1 = CryptoJS.SHA256(password).toString();
			var hashedPassword = CryptoJS.SHA256(temp1).toString();
			// alert("hashedPassword...."+hashedPassword);
			$("#password").val(hashedPassword);
			return hashedPassword;
		}

		/* async function encryptAndSend() {
		    var userPassword = $("#password").val(); // Replace with user's password

		    var hashedPassword = await hashPassword(userPassword);
		alert(hashedPassword);
		console.log("hashedPassword..........."+hashedPassword);
		    document.getElementById('password').value = hashedPassword;
		    document.getElementById('loginForm').submit();
		}

		encryptAndSend(); */

		$(document)
				.ready(
						function() {

							$('#email')
									.on(
											'input',
											function() {
												var email = $(this).val();
												var validEmail = /^[A-Za-z0-9._%+-]+@[A-Za-z0-9.-]+\.[A-Za-z]{2,4}$/
														.test(email);

												$('#email-format-error')
														.toggle(!validEmail);
											});

							$('#password')
									.on(
											'input',
											function() {
												var password = $(this).val();
												var lengthValid = password.length >= 8;
												var uppercaseValid = /[A-Z]/
														.test(password);
												var lowercaseValid = /[a-z]/
														.test(password);
												var digitValid = /[0-9]/
														.test(password);
												var specialCharValid = /[!@#$%^&*()_+{}\[\]:;<>,.?~\\/-]/
														.test(password);

												$('#password-length-error')
														.toggle(!lengthValid);
												$('#password-uppercase-error')
														.toggle(!uppercaseValid);
												$('#password-lowercase-error')
														.toggle(!lowercaseValid);
												$('#password-digit-error')
														.toggle(!digitValid);
												$('#password-specialchar-error')
														.toggle(
																!specialCharValid);
											});
							// Show/hide select dropdown and checkbox roles based on user interaction

							$('#signupLink')
									.submit(
											function(event) {
												event.preventDefault(); // Prevent the form from submitting normally
												//alert("aaasss");
												var passwordInput = $(
														'#password').val();

												var csrfToken = $(
														"meta[name='_csrf']")
														.attr("content");
												var csrfHeader = $(
														"meta[name='_csrf_header']")
														.attr("content");

												var hashedPassword = hashPassword(passwordInput);
												//passwordInput.val(hashedPassword);
												$('#password').val(
														hashedPassword);
												// Get the form data
												var formData = {
													username : $('#username')
															.val(),
													password : hashedPassword,
													firstName : $('#firstName')
															.val(),
													lastName : $('#lastName')
															.val(),
													email : $('#email').val(),
													role : [ $('#role').val() ],
													captcha : $('#captcha')
															.val()

												/* 					rememberMe : $('#rememberMe').prop('checked') */
												};

												// Set up the header and token for all AJAX requests

												// Send an AJAX request to the backend for authentication
												/* formData._csrf = csrfToken; */
												$
														.ajax({

															type : "POST",
															contentType : "application/json",
															url : "/signup",
															data : JSON
																	.stringify(formData),
															dataType : 'json',
															cache : false,
															beforeSend : function(
																	xhr) {
																xhr
																		.setRequestHeader(
																				csrfHeader,
																				csrfToken);
															},
															headers : {
																'X-CSRF-TOKEN' : csrfToken,
																'X-XSRF-HEADER' : csrfHeader
															},
															timeout : 600000,
															success : function(
																	data) {

																//$('#message').val(JSON.stringify(data.message));
																$(
																		'.error-message')
																		.empty();
																console
																		.log(
																				"SUCCESS : ",
																				data.message);
																$('#signupLink')
																		.each(
																				function() {
																					this
																							.reset();
																				});
																$("#register")
																		.prop(
																				"disabled",
																				true);

																$('#message')
																		.text(
																				data.message);
																$('#message_er')
																		.text(
																				"");

															},
															error : function(
																	xhr, data,
																	status, e) {
																if (xhr.status === 400) {
																	$(
																			'#message_er')
																			.text(
																					"Registration Failed");

																	var errorResponse = JSON
																			.parse(xhr.responseText);
																	var errorMessage = errorResponse.message;
																	var errorType = errorResponse.errorType;
																	$(
																			'.error-message')
																			.empty();
																	$(
																			'#password')
																			.val(
																					''); // Reset password field
																	if (errorType === "email") {
																		$(
																				'#email-error')
																				.text(
																						errorMessage);
																	} else if (errorType === "username") {
																		$(
																				'#username-error')
																				.text(
																						errorMessage);
																	} else {
																		// Handle other types of errors
																	}
																} else {

																}
															}
														});
											});
							function clearInputFields() {
								// Clear input field values
								$("#username").val("");
								$("#password").val("");
								$("#firstName").val("");
								$("#lastName").val("");
								$("#email").val("");
								$("#role").val("");
								// Clear more inputs as needed
							}
						});
	</script>

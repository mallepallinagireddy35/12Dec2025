<script>
	$(document).ready(function() {
		$('#togglehindiCard').click(function() {
			translateIt();
			if ($(this).is(':checked')) {
				$('#hindiCard_2').show();
			} else {
				$('#hindiCard_2').hide();
			}
		});
	});
	async function translateIt() {
	    const url = 'https://api.mymemory.translated.net/get';

	    const englishInputs = document.querySelectorAll('.ind_field input[type="text"]');
	    
	    for (let i = 0; i < englishInputs.length; i++) {
	        const englishInput = englishInputs[i];
	        const englishValue = englishInput.value;

	        if (!englishValue) continue;

	        const hindiInputId = englishInput.id + '_hi';
	        const hindiInput = document.getElementById(hindiInputId);

	        if (hindiInput) {
	            const params = new URLSearchParams({
	                q: englishValue,
	                langpair: 'en|hi'
	            });

	            try {
	                const response = await fetch(`${url}?${params}`);
	                const data = await response.json();
	                hindiInput.value = data.responseData.translatedText;
	            } catch (error) {
	                console.error('Translation error:', error);
	            }
	        }
	    }
	}

	var inputElement;
	var selectedButton;
	function hyperlinksPopupMethod(el) {
		event.preventDefault();
		selectedButton = el;
		getPages();
		getForms();
		getDocs();

	};
	function itemSelected(link) {
		console.log(selectedButton.previousSibling);
		document.getElementById("menu_url").value = link;
		selectedButton.previousSibling.value = link;
	}
	function getPages() {
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		$.ajax({
			type : "GET",
			url : "/getListPages",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			dataType : 'json',
			contentType : "application/json",
			success : function(data) {
				var pages_data = document.getElementById("pages-data");
				pages_data.innerText = "";
				for (var i = 0; i < data.length; i++) {
					var div = document.createElement("div");
					div.classList.add("row", "border", "border-1");
					var span = document.createElement("div");
					span.classList.add("col-1");
					span.innerText = data[i].page_id;
					div.appendChild(span);

					var span = document.createElement("div");
					span.classList.add("col-4");
					span.innerText = data[i].page_name;
					div.appendChild(span);

					var span = document.createElement("div");
					span.classList.add("col-2");
					span.innerText = data[i].status;
					div.appendChild(span);

					if (data[i].link != '') {
						var span = document.createElement("a");
						span.classList.add("col-2");
						span.setAttribute("href", data[i].link);
						span.setAttribute("target", "_blank");
						span.innerText = "Preview Page";
						div.appendChild(span);

						var span = document.createElement("div");
						span.classList.add("btn", "btn-success", "col-2",
								"my-2");
						span.setAttribute("onClick", "itemSelected('"
								+ data[i].link + "')");
						span.innerText = "Select Link";
						div.appendChild(span);
					} else {
						var span = document.createElement("div");
						span.classList.add("btn", "col-4", "my-2");
						span.innerText = "Pending for Approval";
						div.appendChild(span);
					}
					pages_data.appendChild(div);
				}
			}
		});
	};

	function getForms() {
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		$.ajax({
			type : "GET",
			url : "/getListForms",

		<h4>Two Step Navigation Menu Items</h4>
		<div class="ind_field">
		<spring:form action="add_content.htm" method="POST" commandName="WebMenuBean"  enctype="multipart/form-data" autocomplete="off">
			<div class="row">			                             
				<div class="col-lg-2 col-md-2 col-sm-2">
					<label>Main Navigation Items</label> <select class="form-control"
						name="mainlevel" id="main_dsc" required="true"
						data-ng-model="NpaDetails.mainlevel_desc"
						ng-change="getLevelOneData();">
						<option value="">Select</option>
						<c:forEach items="${mainList}" var="rg">
							<option value="${rg.mainlevel}"><c:out
									value="${rg.mainlevel_desc}" /></option>
						</c:forEach>
					</select>
				</div>
				<div class="col-lg-2 col-md-2 col-sm-2">
					<label>Level One Navigation</label> <select class="form-control"
						name="level1" id="level1_dsc" required="true"
						data-ng-model="NpaDetails.level1_desc"
						ng-change="getLevelTwoData();">
						<option value="">Select</option>
						<c:forEach items="${levelOneList}" var="rg">
							<option value="${rg.level1}"><c:out value="${rg.level1_desc}" /></option>
						</c:forEach>
						<option ng-repeat="x in listofLevelOneMenu" value="{{x.level1}}">{{x.level1_desc}}</option>
					</select>
				</div>


	<%-- 		
		<div ng-if="true">

				<div class="col-lg-2 col-md-2 col-sm-2" ng-if="listofLevelTwoSize  > 1">

                <td class="col-lg-6 col-md-6 col-sm-6"  colspan="2">

                </td>
                </tr> 
                
                                 <tr class="row">

              </div>
				<div class="text-center">
					<br />

	<script>

	function myAdContFun() {
		  var div = document.getElementById("adCont");
		  div.innerHTML = '<label>Content Text</label><textarea name="content" class="form-control" rows="3" style="width:60%;"></textarea>';
		}

function myInsideTab(){
alert("myInsideTab");
	 var table = document.getElementById("myInsideTab");
	  var row1 = table.insertRow(1);
	  var r1cell1 = row1.insertCell(0);
	  r1cell1.innerHTML = '<label>Content Text</label><textarea name="content" class="form-control" rows="3" style="width:50%;"></textarea>';
}
	
function myAddFun() {
  var table = document.getElementById("myTable");
  var row1 = table.insertRow(4);
  var row2 = table.insertRow(5);
  var row3 = table.insertRow(6);
  var row4 = table.insertRow(7);
  var r1cell1 = row1.insertCell(0);
  var r2cell1 = row2.insertCell(0);
  var r3cell1 = row3.insertCell(0);
  var r4cell1 = row4.insertCell(0);
  r1cell1.innerHTML = '<label>Heading</label><input type="text" name="heading" class="form-control" style="width:50%;">';
  r2cell1.innerHTML = '<label>Sub-Heading</label><input type="text" name="sub_heading" class="form-control" style="width:50%;">';
  r3cell1.innerHTML = '<label>Content Text</label><textarea name="content" class="form-control" rows="3" style="width:50%;"></textarea>';
  r4cell1.innerHTML = '<label>Content Image</label><input type="file" name="content_image" class="form-control" style="width:50%;">';
}
</script>
<script>
function myDelFun() {
  this.myDelFun1();
  this.myDelFun2();
  this.myDelFun3();

}
function myDelFun1() {
	  document.getElementById("myTable").deleteRow(-1);
	}

	  document.getElementById("myTable").deleteRow(-1);

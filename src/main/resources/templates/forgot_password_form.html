<script>
	function showLoading() {
		document.getElementById("loading").style.display = "block";
	}

	function hideLoading() {
		document.getElementById("loading").style.display = "none";
	}

	function encryptAndSend() {
		var username = $("#username").val();
		var captchaEntered = $("#captcha").val().trim();
		var captchaSecurity = document.getElementById('captcha_security').value;

		if (!username) {
			alert("Please enter UserName.!");
			return;
		}

		if (captchaEntered === "" || captchaEntered === null) {
			alert("Please enter Captcha!, must not be blank!");
			return;
		}

		if (captchaSecurity === "" || captchaSecurity === null) {
			alert("Refresh Captcha.");
			document.getElementById('captcha').value = "";
			return false;
		}

		if (captchaEntered.toUpperCase() != captchaSecurity.toUpperCase()) {
			alert("Enter Correct Captcha.");
			return false;
		}

		showLoading(); // Show loading overlay before form submission

		// Manually submit the form
		document.getElementById('forgot-passwordForm').submit();

		// After submission, you can hide the loading overlay in a callback or using other logic.
		// For example, you can use an AJAX callback for form submission and hide the loading overlay when the response is received.
	}
</script>

<script>
	function wordCapital(obj) {
		obj.value = obj.value.toUpperCase();
	}

	function getAudioCaptcha() {
		//var csrfToken = $("input[name='_csrf']").val();
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha/getCaptcha?_csrf=" + csrfToken
					+ "&timestamp=" + uniqueTimestamp,
			dataType : 'json',
			success : function(data, status) {
				var cpt = data.captchaSession;
				$(document).ready(function() {

					for (var i = 0; i < cpt.length; i++) {
						responsiveVoice.speak(cpt[i]);
					}
					if (typeof (data.error) !== 'undefined') {
					}

				});
			},
			error : function(data, status) {
				alert('error1');
			}
		}, new function() {
		})
	}

	function DrawCaptcha() {
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

		refreshCaptchaImage(csrfHeader, csrfToken);

		// Note: We removed the getCaptchaValue function call from here

		return false;
	}

	// Function to refresh the CAPTCHA image
	function refreshCaptchaImage(csrfHeader, csrfToken) {
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha?_csrf=" + csrfToken + "&timestamp="
					+ uniqueTimestamp,
			dataType : 'json',
			success : function(data, status) {
				var captchaImageSrc = "data:image/jpeg;base64," + data.image; // Assuming data.image contains the Base64-encoded image data
				document.getElementById('captchaImage').src = captchaImageSrc;

				// After refreshing the CAPTCHA image, get the CAPTCHA value from the session
				getCaptchaValue(csrfHeader, csrfToken);
			},
			error : function(data, status) {
				alert('Error while refreshing CAPTCHA image.');
			}
		});
	}

	// Function to get the CAPTCHA value from the session
	function getCaptchaValue(csrfHeader, csrfToken) {
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha/getCaptcha?_csrf=" + csrfToken
					+ "&timestamp=" + uniqueTimestamp,
			dataType : 'json',
			success : function(captchaData) {
				var cpt = captchaData.captchaSession;
				// Set the value of captcha_security after getting the value
				document.getElementById('captcha_security').value = cpt;
				// Wait for the DOM to be fully loaded before setting the value
				$(document).ready(function() {
					$('#captcha_security').val(cpt);
				});
			},
			error : function(xhr, status, error) {
				console.error("Error:", error);
				alert('Error while fetching CAPTCHA: ' + error);
			}
		});
	}
</script>

<body>
	<div class="flex-wrapper">

		<div id="loading"
			style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 9999;">
			<div
				style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
				<img src="path_to_your_loading_image.gif" alt="Loading...">
			</div>
		</div>
		<div class="container">
			<div class="row">
				<div class="col-md-6 offset-md-3 login-container bg_over">
					<h2>Forgot Password</h2>
					<p>Enter your username to initiate the password reset process.</p>
					<form th:action="@{/forgot-password}" method="post"
						id="forgot-passwordForm">
						<label for="username">Username</label> <input type="text"
							id="username" name="username" required class="form-control">
						<input type="hidden" id="captcha_security"
							th:value="${captchaString}" />
						<div class="row mt-3 g-1">
							<div class="col-8 mt-4" z-index=0>
								<div class="captchaHolder">
									<!--									<img id="ssss" />-->
									<!--	<img id="captchaImage" />-->

									<!--	<img id="captchaImage" th:src="${captchaImage}" alt="CAPTCHA Image" />-->

									<img id="captchaImage"
										th:src="${'data:image/jpeg;base64,' + captchaImage}"
										alt="CAPTCHA Image" /> <i class="fas fa-volume-high cptIcons"
										onclick="getAudioCaptcha()"></i> <i
										class="fas fa-arrows-rotate cptIcons" onclick="DrawCaptcha()"></i>

								</div>
							</div>
							<div class="col-4">
								<div class="form-group">
									<label for="captcha">Enter Captcha</label> <input type="text"
										class="form-control" id="captcha" name="captcha"
										onkeyup="wordCapital(this)" minlength="6" maxlength="6"
										AUTOCOMPLETE="OFF" aria-label="Enter Captcha" required
										style="text-transform: uppercase;">
								</div>
							</div>
						</div>

						<div th:if="${param.success}">
							<p style="color: green;" th:text="#{forgot-password.success}"></p>


						</div>
						<div th:if="${param.emailError}">
							<p style="color: red;" th:text="#{forgot-password.emailError}"></p>


						</div>

						<div th:if="${param.timedout}">
							<p style="color: red;" th:text="#{forgot-password.timedout}"></p>


						</div>
						<div th:if="${param.noUserFound}">
							<p style="color: red;" th:text="#{forgot-password.noUserFound}"></p>


						</div>
						<div class="mt-2">
							<button type="button" onclick="encryptAndSend()"
								class="btn btn-primary">Change Submit</button>

						</div>

						<div class="mt-3">
							<a th:href="@{/getsignin}" class="btn btn-secondary">Go Back</a>
						</div>
					</form>
					<div id="loading"
						style="display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background-color: rgba(0, 0, 0, 0.5); z-index: 9999;">
						<div
							style="position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);">
							<img src="path_to_your_loading_image.gif" alt="Loading...">
						</div>
					</div>
					<!-- Display success or error message -->
					<!--<div th:if="${param.success}" class="success-message">
					Password reset email sent successfully. Please Check your
					Inbox/Spam Folder to reset the password.</div>-->
					<div th:if="${param.error}" class="error-message">User not
						found. Please check your username.</div>
				</div>
			</div>
		</div>
	</div>
</body>

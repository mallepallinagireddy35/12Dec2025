   	<script>
	function getAudioCaptcha() {	
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha/getCaptcha?_csrf=" + csrfToken
					+ "&timestamp=" + uniqueTimestamp,
			dataType : 'json',
			success : function(data, status) {
				var cpt = data.captchaSession;
				$(document).ready(function() {

					for (var i = 0; i < cpt.length; i++) {
						responsiveVoice.speak(cpt[i]);
					}
					if (typeof (data.error) !== 'undefined') {
					}

				});
			},
			error : function(data, status) {
				alert('error1');
			}
		}, new function() {
		})
	}

	function DrawCaptcha() {
	    var csrfToken = $('meta[name="_csrf"]').attr('content');
	    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

	    refreshCaptchaImage(csrfHeader, csrfToken);

	    // Note: We removed the getCaptchaValue function call from here

	    return false;
	}

	// Function to refresh the CAPTCHA image
	function refreshCaptchaImage(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (data, status) {
	            var captchaImageSrc = "data:image/jpeg;base64," + data.image; // Assuming data.image contains the Base64-encoded image data
	            document.getElementById('captchaImage').src = captchaImageSrc;

	            // After refreshing the CAPTCHA image, get the CAPTCHA value from the session
	            getCaptchaValue(csrfHeader, csrfToken);
	        },
	        error: function (data, status) {
	            alert('Error while refreshing CAPTCHA image.');
	        }
	    });
	}

	// Function to get the CAPTCHA value from the session
	function getCaptchaValue(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha/getCaptcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (captchaData) {
	            var cpt = captchaData.captchaSession;
	            // Set the value of captcha_security after getting the value
	            document.getElementById('captcha_security').value = cpt;
	            // Wait for the DOM to be fully loaded before setting the value
	            $(document).ready(function () {
	                $('#captcha_security').val(cpt);
	            });
	        },
	        error: function (xhr, status, error) {
	            console.error("Error:", error);
	            alert('Error while fetching CAPTCHA: ' + error);
	        }
	    });
	}
</script>

<script th:inline="javascript">
    /*<![CDATA[*/
    var timer;

    function startTimer(duration) {
        var timerDisplay = document.getElementById("timer");
        var regenOtpCount = document.getElementById("count").value;
        function updateTimer() {
            var minutes = Math.floor(duration / 60);
            var seconds = duration % 60;
            timerDisplay.textContent = "OTP elapsed Time: " + minutes + "m " + seconds + "s";
            document.getElementById("otphider").style.display = 'none';
            document.getElementById("otphider1").style.display = 'none';
            document.getElementById("reotphider").style.display = 'none';
            
            if (--duration < 0) {
                clearInterval(timer);
                if(regenOtpCount<=3){
                document.getElementById("reotphider").style.display = 'block';
                timerDisplay.textContent = "";
                regenOtpCount++;
            	document.getElementById("count").value = regenOtpCount;
                }else{
				clearInterval(timer);
				document.getElementById("reotphider").style.display = 'none';
                timerDisplay.textContent = "";	
				}
            }                        
        }

        updateTimer();
        timer = setInterval(updateTimer, 1000);
    }

    function generateOTP() {
				var csrfToken = document.head.querySelector('meta[name="_csrf"]').content;
			    var csrfHeader = document.head.querySelector('meta[name="_csrf_header"]').content;
			    var uniqueTimestamp = new Date().getTime();
                var mobile =  document.getElementsByName('mobile')[0].value;
            	if (mobile === '') {			       
			        alert("Please enter Mobile No")
			        return false;			        
			      } 
			    
        $.ajax({			
            type: 'POST',
            url: '/generateOtp?_csrf=' + csrfToken
					+ '&timestamp=' + uniqueTimestamp + '&mobile=' + mobile,
            success: function (response) {
                startTimer(180); // 3 minutes
            },
	        error: function (error) {
	            //console.error("Error: ", error);
	            alert('Error while generating OTP : ' + error);
	        }
        });
    }

    function validateOtp() {
		var timerDisplay = document.getElementById("timer");
        		var csrfToken = document.head.querySelector('meta[name="_csrf"]').content;
			    var csrfHeader = document.head.querySelector('meta[name="_csrf_header"]').content;
			    var uniqueTimestamp = new Date().getTime();			    
		    	var enteredOtp =  document.getElementsByName('otp')[0].value;
            	if (enteredOtp === '') {			       
			        alert("Please enter OTP")
			        return false;			        
			      } 
			      
        $.ajax({
            type: 'POST',
            url: '/validateOtp?_csrf=' + csrfToken
					+ '&timestamp=' + uniqueTimestamp+ '&enteredOtp=' + enteredOtp,
            //data: { enteredOtp: enteredOtp },
            success: function (response) {
                if (response === 'valid') {                    
                    clearInterval(timer);
                    timerDisplay.textContent = "OTP is valid";
                } else {
                    document.getElementsByName('otp')[0].value = '';
                    //alert("Invalid OTP");
                    alert(response);
                    return false;
                }
            },
	        error: function (error) {
	         //   console.error("Error: ", error);
	            alert('Error while validating OTP : ' + error);
	        }
        });
    }
    /*]]>*/
</script>

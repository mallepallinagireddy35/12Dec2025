
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<title>Edit Form Data</title>
<!-- Import CSS -->
<link href="static/assets/bootstrap_5.3/css/bootstrap.css" rel="stylesheet">
<link href="static/assets/custom/css/style.css" rel="stylesheet">
<link href="static/assets/fontawesome_6.4/css/all.min.css" rel="stylesheet">

<!-- Import JS -->
<script src="static/assets/jQuery_3.6/jquery.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.bundle.min.js"></script>
<script src="static/assets/fontawesome_6.4/js/all.min.js"></script>
<script>
	$(function() {
		//$("#includeHeader").load("header.html");
		$("#includeFooter").load("footer.html");
	});
</script>
<script src="resource/assets/js/sha1.js"></script>
<script src="resource/assets/js/sha256.js"></script>
<script src="resource/assets/js/ajax.js"></script>
<script src="resource/assets/js/Json-validation.js"></script>
<script src="resource/assets/jQuery-3.6/jquery-3.6.0.min.js"></script>

<!--<script src="resource/angularjs/1.2.1/angular.min.js"></script>-->

<script src="resource/angularjs/1.8.2/angular.min.js"></script>
<script src="resource/angularjs/app.js"></script>
<script src="resource/scripts/controllers/svpnpa.js"></script>


</head>
<body data-ng-app="ajssample" data-ng-controller="svpnpaController">
		<div id="includeHeader" th:replace="~{header.html::header}"></div>
	<div class="container">
		<h3 class="pageHeading" style="text-align: center;">Form Data Preview</h3>			
		<form method="GET" name="myForm" id="myForm" commandName="form" th:action="@{/getFormDataPreview}">
			<input type="hidden" id="jsonData" name="jsonData" /> <input
				type="hidden" id="jsonCheck" name="jsonCheck" /> <input
				type="hidden" id="form_name" name="form_name" />
				<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
				<input type="hidden" name="_csrf_header" th:value="${_csrf.headerName}"/>
			<div class="row g-2 d-flex justify-content-center">
				<div class="col-3 mb-3">
					<div class="form-group floating-label">
						<select name="form_id" class="form-select" id="form_id"
							required="true" data-ng-model="recordDetails.form_id"
							data-ng-change="getListOfRecords()">
							<option value="" selected>Select Form Name</option>
							<option th:each="bean : ${list}" th:value="${bean.form_id}"
								th:text="${bean.form_name}"></option>
						</select> <label for="form_id">Form Name</label>
					</div>
				</div>
				<div class="col-3 mb-3">
					<div class='form-group floating-label'>
						<select class="form-select" name="record_id" required="true"
							id="record_id" data-ng-model="recordDetails.record_id">
							<option value="" selected>Select Record</option>
							<option ng-repeat="x in recordDetails.list"
								value="{{x.record_id}}">{{x.record_id}}</option>
						</select> <label for='record_id'>Record</label>
					</div>
				</div>
			</div>
			<div class="card-body">
				<div id="ssr"></div>
				<div class="mx-auto col-2 mt-3 mb-3">
					<button class="btn btn-primary" type="submit" name="submit">Submit</button>
				</div>
			</div>
			<center><span style="color: green; text-align: center;" th:text="${msg}"></span></center>
			<center><span style="color: red; text-align: center;" th:text="${msg1}"></span></center>
		</form>
	</div>
	<div id="includeFooter" style="margin-top: 300px;"></div>
</body>
</html>

<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">

<meta name="_csrf" th:content="${_csrf.token}"/>
<meta name="_csrf_header" th:content="${_csrf.headerName}"/>
<title>Generate Form</title>
<!-- Import CSS -->
<link href="static/assets/bootstrap_5.3/css/bootstrap.css" rel="stylesheet">
<link href="static/assets/custom/css/style.css" rel="stylesheet">
<link href="static/assets/fontawesome_6.4/css/all.min.css" rel="stylesheet">

<!-- Import JS -->
<script src="static/assets/jQuery_3.6/jquery.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.bundle.min.js"></script>
<script src="static/assets/fontawesome_6.4/js/all.min.js"></script>
<script>
	$(function() {
		//$("#includeHeader").load("header.html");
		$("#includeFooter").load("footer.html");
	});
</script>
<script src="static/resource/assets/js/sha1.js"></script>
<script src="static/resource/assets/js/sha256.js"></script>
<script src="static/resource/assets/js/ajax.js"></script>
<script src="static/resource/assets/js/Json-validation.js"></script>
<script src="static/resource/assets/jQuery-3.6/jquery-3.6.0.min.js"></script>

<script src="static/resource/angularjs/1.8.2/angular.min.js"></script>
<script src="static/resource/angularjs/app.js"></script>
<script src="static/resource/scripts/controllers/svpnpa.js"></script>
<style>
	.error {
    color: red;
}
</style>

<script>
	function verifyfun(){
	 var approve = document.getElementById('approve').value;
	 if(approve == 'A'){
	  document.getElementById('ssr1').style.display = 'none';	 
	 }else{
	  document.getElementById('ssr1').style.display = 'block'; 
	 }
	}
	function verifyValid(){
		if(document.getElementById('form_id').value == ''){
		alert('Please Select Form');
        document.getElementById('form_id').focus();
        return false;			
		}
	 var approve = document.getElementById('approve').value;
	 if(approve == 'R'){
	  if (document.getElementById('remark').value == '') {
        alert('Please Enter Remark');
        document.getElementById('remark').focus();
        return false;
    }	 
	 }else{}	
	}
</script>

</head>
<body data-ng-app="ajssample" data-ng-controller="svpnpaController">
		<div id="includeHeader" th:replace="~{header.html::header}"></div>
	<div class="container">
		<h3 class="pageHeading" style="text-align: center;">Verify Form Fields</h3>
		<span style="color: green; text-align: center;" th:text="${msg}"></span>
		<span style="color: red; text-align: center;" th:text="${msg1}"></span>
		<form method="POST" name="myForm" id="myForm" commandName="form"  th:action="@{/getFormVerify}" onsubmit="return verifyValid();">
			<input type="hidden" id="jsonData" name="jsonData" /> 
			<input type="hidden" id="jsonCheck" name="jsonCheck" /> 
				<input type="hidden" id="form_name" name="form_name" /> 
				<input type="hidden" id="con_value" name="con_value" />
				<input type="hidden" id="currentDate" name="currentDate" th:value="${#dates.format(currentDate, 'yyyy-MM-dd')}"/>
				<input type="hidden" name="_csrf" th:value="${_csrf.token}"/>
				<input type="hidden" name="_csrf_header" th:value="${_csrf.headerName}"/>
				<div class="row g-2 d-flex justify-content-center">
				<div class="col-3 mb-3 floating-label">
					<div class='form-group floating-label'>
							<select class='form-select' name='form_id'
								id='form_id' data-ng-model="formDetailsVerify.form_id"
						ng-init="formDetailsVerify.form_id='${formDetailsVerify.form_id}'"
						data-ng-change="getFormStructureVerify()" required="true">
								<option value="${formDetailsVerify.form_id}">Select</option>
								<option th:each="bean : ${list}" th:value="${bean.form_id}"
								th:text="${bean.form_name}"></option>
							</select> <label for="form_id">Form name</label>
						</div>
				</div>
				<div class="col-3 mb-3 floating-label">
					<input type="text" id="fields" name="fields" class="form-control"
					data-ng-model="formDetailsVerify.fields" maxlength="3"
						AUTOCOMPLETE="OFF" label="Fields" onchange="show(this.value);" readonly="true" placeholder="" /> <label for="fields">Number
						Of Fields</label>
				</div>
			</div>
			<div class="card-body overflowCard">
				<div id="ssr"></div>
				
				
				<br/>
				<br/>
				<br/>
				<div class="clearfix"></div>
				<div class="col-4 mb-4 floating-label" id="npa" style="display: none;">
					<div class='form-group floating-label'>
							<select class='form-select' name='approve' id='approve' required="true" onchange="verifyfun()">
								<option value="">Select</option>
								<option value="A">Approve</option>
								<option value="R">Reject</option>
							</select> <label for="Approve/Reject">Approve / Reject</label>
					</div> 
						</div>
						
							<div id="ssr1" style="display: none;">
			<div class="row g-2 d-flex justify-content-center">
					<div class="col-3 mb-3 floating-label">
					<div class='form-group floating-label'>
					<input input type="text" class='form-control' name="remark" id="remark" autocomplete="off"
						onkeypress="return ValidateAlpha(event)"
						onblur="return checkString(this, 'Remark');"
						placeholder="Remark">
					<label for="Remark">Remark</label>
					</div>
				</div>
				</div>
				</div>
						
						
				<div class="mx-auto col-2 mt-3 mb-3">
					<button class="btn btn-primary" type="submit" name="submit">Submit</button>
				</div>
			</div>
		</form>
	</div>
	<div id="includeFooter"></div>
</body>
</html>

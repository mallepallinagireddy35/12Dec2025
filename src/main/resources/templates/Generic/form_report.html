<html xmlns:th="http://www.thymeleaf.org">

<head>
<meta charset="UTF-8">
<title>Report</title>
<!-- Import CSS -->
<link href="static/assets/bootstrap_5.3/css/bootstrap.css"
	rel="stylesheet">
<link href="static/assets/custom/css/style.css" rel="stylesheet">
<link href="static/assets/fontawesome_6.4/css/all.min.css"
	rel="stylesheet">

<!-- Import JS -->
<script src="static/assets/jQuery_3.6/jquery.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/popper.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.bundle.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.min.js"></script>

<!-- Import Datatables -->
<link
	href="static/assets/DataTables/DataTables-1.13.1/css/dataTables.bootstrap5.min.css"
	rel="stylesheet">
<link
	href="static/assets/DataTables/DataTables-1.13.1/css/jquery.dataTables.min.css"
	rel="stylesheet">
<script
	src="static/assets/DataTables/DataTables-1.13.1/js/dataTables.bootstrap5.min.js"
	type="text/javascript"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/js/jquery.dataTables.min.js"
	type="text/javascript"></script>

<!-- Export Datatable Content -->
<link
	href="static/assets/DataTables/DataTables-1.13.1/export/buttons.dataTables.min.css"
	rel="stylesheet">

<script
	src="static/assets/DataTables/DataTables-1.13.1/export/dataTables.buttons.min.js"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/export/jszip.min.js"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/export/pdfmake.min.js"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/export/vfs_fonts.js"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/export/buttons.html5.min.js"></script>
<script
	src="static/assets/DataTables/DataTables-1.13.1/export/buttons.print.min.js"></script>



<script>
	$(function() {
		//$("#includeHeader").load("header.html");
		$("#includeFooter").load("footer.html");
	});
</script>
</head>

<body>
	<div id="includeHeader" th:replace="~{header.html::header}"></div>
	<div class="container">
		<h3 class="pageHeading" style="text-align: center;">Report</h3>
		<span style="color: green; text-align: center;" th:text="${msg}"></span>
		<span style="color: red; text-align: center;" th:text="${msg1}"></span>

		<div class="shadow p-3 mb-5 bg-body-tertiary rounded overflow-x-auto">
			<table id="dataTableId" class="table table-striped"
				style="width: 100%">
				<thead>
					<tr>
						<th th:each="bean: ${columnsList}" th:text="${bean.column_name}"></th>
					</tr>
				</thead>
				<tbody>
					<tr th:each="list : ${reportList}">
						<td th:each="bean: ${list}" th:text="${bean.column_value}" />
					</tr>
				</tbody>
			</table>
			<!-- <div class="mx-auto col-2 mt-2">
				<button class="btn btn-primary" type="submit" id="print-pdf">Print</button>
			</div> -->
		</div>
		<div id="includeFooter" style="margin-top: 300px;"></div>
	</div>
</body>

</html>
<script>
	$(document).ready(
			function() {
				$('#dataTableId').DataTable(
						{
							dom : 'Bfrtip',
							/* dom: 'flit', */
							lengthMenu : [
									[ 10, 25, 50, -1 ],
									[ '10 rows', '25 rows', '50 rows',
											'Show all' ] ],
							buttons : ['pageLength', 'excel', 'print'
							/* 'copy', 'csv', 'excel', 'pdf', 'print' */
							]
						});
			});
</script>

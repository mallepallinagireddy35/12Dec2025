		function isPasswordValid(password) {
			// Password pattern: Minimum 8 characters, at least one uppercase, one lowercase, one special character, and one digit
			var passwordPattern = /^(?=.*\d)(?=.*[a-z])(?=.*[A-Z])(?=.*[@#$%^&+=]).{8,}$/;
			return passwordPattern.test(password);
		}

		function hashPassword1(password) {

			if (!isPasswordValid(password)) {
				alert("Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one special character, and one digit.");
				return;
			}
			var temp1 = CryptoJS.SHA256(password).toString();
			var hashedPassword = CryptoJS.SHA256(temp1).toString();
			return hashedPassword;
		}
		function hashPassword2(password) {

			if (!isPasswordValid(password)) {
				alert("Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one special character, and one digit.");
				return;
			}
			var temp1 = CryptoJS.SHA256(password).toString();
			var hashedPassword = CryptoJS.SHA256(temp1).toString();
			return hashedPassword;
		}

		function hashPassword3(password) {

			if (!isPasswordValid(password)) {
				alert("Password must be at least 8 characters long and contain at least one uppercase letter, one lowercase letter, one special character, and one digit.");
				return;
			}
			var temp1 = CryptoJS.SHA256(password).toString();
			var hashedPassword = CryptoJS.SHA256(temp1).toString();
			return hashedPassword;
		}
		function checkNewPassword() {
			var userNewPassword = $("#newPassword").val();
			var csrfToken = $('meta[name="_csrf"]').attr('content');
			var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
			// Check if the new password is empty
			if (!userNewPassword) {
				$("#password-error_new").text("Please enter the New password.");
				return;
			}

			var temp1 = CryptoJS.SHA256(userNewPassword).toString();
			var hashedPassword = CryptoJS.SHA256(temp1).toString();
			//	return hashedPassword;
//			alert("ass");
			// Make an AJAX call to check the new password
			$.ajax({
				type: "POST",
				beforeSend: function (xhr) {
					xhr.setRequestHeader(csrfHeader, csrfToken);
				},
				headers: {
					'X-CSRF-TOKEN': csrfToken,
					'X-XSRF-HEADER': csrfHeader
				},
				url: "/check-new-password", // Replace with the actual endpoint URL
				data: {newPassword: hashedPassword},
				success: function (data) {
					if (data.error) {
						$("#password-error_new").text(data.error);
						$("#newPassword").val(""); // Clear the new password field
						$("#confirmPassword").val(""); // Clear the confirm password field
					} else {
						// Clear any previous error messages
						$("#password-error_new").text("");
					}
				},
				error: function () {
					alert("An error occurred while checking the new password.");
				},
			});
		}

		function encryptAndSend() {

			var userOldPassword = $("#oldPassword").val();
			//alert("userOldPassword"+userOldPassword);
			var userNewPassword = $("#newPassword").val();
			var userConfirmPassword = $("#confirmPassword").val();
			var captchaEntered = $("#captcha").val().trim();
			var captchaSecurity = document.getElementById('captcha_security').value;

			// Validate if old password is entered
			if (!userOldPassword) {
				alert("Please enter the old password.");
				return;
			}

			// Validate if new password is entered
			if (!userNewPassword) {
				alert("Please enter the New password.");
				return;
			}

			// Check if the old password and new password are the same
			if (userOldPassword === userNewPassword) {
				alert("Old password and new password cannot be the same.");
				return;
			}

			// Validate if confirm password is entered
			if (!userConfirmPassword) {
				alert("Please enter the Confirm New password.");
				return;
			}
			
			if (captchaEntered === "" || captchaEntered === null) {

				alert("Please enter Captcha!, must not be blank!");
				return;
			}
						if (captchaSecurity === "" || captchaSecurity === null) {
				alert("Refresh Captcha.");
				document.getElementById('captcha').value = "";
				return false;
			}

			if (captchaEntered.toUpperCase() != captchaSecurity.toUpperCase()) {
				alert("Enter Correct Captcha.");
				return false;
			}


			var hashedOldPassword = hashPassword1(userOldPassword);
			var hashedNewPassword = hashPassword2(userNewPassword);
			var hashedConfirmPassword = hashPassword3(userConfirmPassword);
			//alert("hashedOldPassword"+hashedOldPassword);
			// Validate if new password and confirm password match
			if (userNewPassword !== userConfirmPassword) {
				alert("Passwords do not match.");
				return;
			}

			// Assign hashed values to input fields
			document.getElementById('oldPassword').value = hashedOldPassword;
			document.getElementById('newPassword').value = hashedNewPassword;
			document.getElementById('confirmPassword').value = hashedConfirmPassword;

			// Submit the form
			document.getElementById('changePasswordForm').submit();
		}
	</script>

		<script>
	function wordCapital(obj) {
		obj.value = obj.value.toUpperCase();
	}

	function getAudioCaptcha() {
		//var csrfToken = $("input[name='_csrf']").val();
		var csrfToken = $('meta[name="_csrf"]').attr('content');
		var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
		var uniqueTimestamp = new Date().getTime();

		$.ajax({
			type : "GET",
			beforeSend : function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
			},
			headers : {
				'X-CSRF-TOKEN' : csrfToken,
				'X-XSRF-HEADER' : csrfHeader
			},
			url : "/captcha/getCaptcha?_csrf=" + csrfToken
					+ "&timestamp=" + uniqueTimestamp,
			dataType : 'json',
			success : function(data, status) {
				var cpt = data.captchaSession;
				$(document).ready(function() {

					for (var i = 0; i < cpt.length; i++) {
						responsiveVoice.speak(cpt[i]);
					}
					if (typeof (data.error) !== 'undefined') {
					}

				});
			},
			error : function(data, status) {
				alert('error1');
			}
		}, new function() {
		})
	}

	function DrawCaptcha() {
	    var csrfToken = $('meta[name="_csrf"]').attr('content');
	    var csrfHeader = $('meta[name="_csrf_header"]').attr('content');

	    refreshCaptchaImage(csrfHeader, csrfToken);

	    // Note: We removed the getCaptchaValue function call from here

	    return false;
	}

	


	// Function to refresh the CAPTCHA image
	function refreshCaptchaImage(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (data, status) {
	            var captchaImageSrc = "data:image/jpeg;base64," + data.image; // Assuming data.image contains the Base64-encoded image data
	            document.getElementById('captchaImage').src = captchaImageSrc;

	            // After refreshing the CAPTCHA image, get the CAPTCHA value from the session
	            getCaptchaValue(csrfHeader, csrfToken);
	        },
	        error: function (data, status) {
	            alert('Error while refreshing CAPTCHA image.');
	        }
	    });
	}

	// Function to get the CAPTCHA value from the session
	function getCaptchaValue(csrfHeader, csrfToken) {
	    var uniqueTimestamp = new Date().getTime();

	    $.ajax({
	        type: "GET",
	        beforeSend: function (xhr) {
	            xhr.setRequestHeader(csrfHeader, csrfToken);
	        },
	        headers: {
	            'X-CSRF-TOKEN': csrfToken,
	            'X-XSRF-HEADER': csrfHeader
	        },
	        url: "/captcha/getCaptcha?_csrf=" + csrfToken + "&timestamp=" + uniqueTimestamp,
	        dataType: 'json',
	        success: function (captchaData) {
	            var cpt = captchaData.captchaSession;
	            // Set the value of captcha_security after getting the value
	            document.getElementById('captcha_security').value = cpt;
	            // Wait for the DOM to be fully loaded before setting the value
	            $(document).ready(function () {
	                $('#captcha_security').val(cpt);
	            });
	        },
	        error: function (xhr, status, error) {
	            console.error("Error:", error);
	            alert('Error while fetching CAPTCHA: ' + error);
	        }
	    });
	}

</script>

<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
<meta charset="UTF-8">
<title>Reset Password</title>
<style>
.error-message {
	color: red;
	font-weight: bold;
}
</style>
<script>
	$(function() {
		//$("#includeHeader").load("header.html");
		$("#includeFooter").load("footer.html");
		$("#objectBrowsering").load("object_selector.html");
	});
</script>
<link href="static/assets/bootstrap_5.3/css/bootstrap.css"
	rel="stylesheet">
<link href="static/assets/custom/css/style.css" rel="stylesheet">
<link href="static/assets/fontawesome_6.4/css/all.min.css"
	rel="stylesheet">

<!-- Import JS -->
<script src="static/assets/jQuery_3.6/jquery.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/popper.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.bundle.min.js"></script>
<script src="static/assets/bootstrap_5.3/js/bootstrap.min.js"></script>
<style>
body {
	background-image: url("static/bg_login.jpg");
	background-size: cover;
	background-repeat: repeat-x;
}

.bg_over {
	/*opacity:0.5;*/
	/*background: linear-gradient(rgba(255,255,255,0.8), rgba(255,255,255,1));*/
	background-image: url("static/bg_login2.jpg");
	background-position: left top;
	background-size: cover;
	/*background: linear-gradient(rgba(255,255,255,0.0), rgba(255,255,255,0.5)), url("bg_login2.jpg");*/
	/*background-repeat:repeat;*/
}

.login-container {
	color: white;
	margin: 0 auto;
	padding: 20px;
	margin-top: 50px;
	border-radius: 5px;
	box-shadow: 3px 5px 5px black;
}

label {
	color: white;
}

.error-message {
	color: red;
	font-weight: bold;
}

p {
	text-align: left;
}
</style>
<script>
	function getAudioCaptcha() {
		var cpt = document.getElementById('ssss').src;
		for (var i = 0; i < cpt.length; i++) {
			responsiveVoice.speak(cpt[i]);
		}
	}
</script>
<style>
.captchaHolder {
	padding: 10px;
	background: linear-gradient(to bottom right, #ffcc66 -37%, #ffffcc 105%);
	border-radius: 4px;
	display: flex;
	flex-direction: row;
	align-items: center;
	box-shadow: rgba(0, 0, 0, 0.24) 0px 3px 8px;
}

.cptIcons {
	margin-left: 5px;
	color: black;
}
.cptTxt {
	color: black;
}
</style>
</head>
<body>	<div class="flex-wrapper">

	<div class="container">
		<div class="row">
			<div class="col-md-6 offset-md-3 login-container bg_over">
				<h2>Reset Password</h2>
				<p>Enter your new password to reset your account password.</p>
				<div th:if="${error}" class="error-message">
					Error: <span th:text="${error}"></span>
				</div>
				<form th:action="@{/reset-password}" method="post">
					<input type="hidden" name="token" th:value="${token}"> <label
						for="password">New Password:</label> <input type="password"
						id="password" name="password" required class="form-control"> <label
						for="confirmPassword">Confirm Password:</label> <input
						type="password" id="confirmPassword" name="confirmPassword"
						required  class="form-control"/>
						<div class='row mt-2 mb-2 g-1 captchaHolder'>
						<div class='col-7 mt-4'>
								<img id='ssss' src='captcha' /><i
									class='fas fa-volume-high cptIcons' onclick='getAudioCaptcha()'></i><i
									class='fas fa-arrows-rotate cptIcons' onclick='DrawCaptcha()'></i>
						</div>
						<div class='col-5'>
							<div class='form-group'>
								<label for='captcha'>Enter Captcha</label> <input type='text'
									class='form-control' name='captcha' id='captcha'
									AUTOCOMPLETE='OFF' aria-label='Enter Captcha'
									onkeypress='return ValidateAlphaNumeric(event)'
									style='text-transform: uppercase;'>
							</div>
						</div>
					</div>
					<button type="submit" class="btn btn-primary">Reset Password</button>
				</form>

				<!-- Display success or error message -->
				<div th:if="${param.success}" class="success-message">
					Password reset successful. You can now <a href="/getsignin">log
						in</a> with your new password.
				</div>
				<div th:if="${param.error}" class="error-message">Password
					reset failed. Please try again or contact support.</div>
			</div>
		</div>
	</div>
	</div>
</body>
</html>

	<!-- Bootstrap JS -->
	<script>
		
		let selectedItem = null;
		function selectItem(typeGiven, el) {
			var csrfToken = $('meta[name="_csrf"]').attr('content');
			var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
			
			const card = event.currentTarget;
			var hyperLinks = '';
			if (typeGiven == 1) {
				hyperLinks = 'table';
			} else if (typeGiven == 6) {
				hyperLinks = 'paragraph';
			} else if (typeGiven == 3) {
				hyperLinks = 'list';
			} else if (typeGiven == 10) {
				hyperLinks = 'embed';
			} else if (typeGiven == 2) {
				hyperLinks = 'galleryObjects?type=' + typeGiven;
			} else {
				hyperLinks = 'galleryObjects?type=' + typeGiven;
			}
			var type = {
				'type': typeGiven
			};
			var cards = document.getElementsByClassName("table-button");
			for (var i = 0; i < cards.length; i++)
				cards[i].classList.remove("opase");
			for (var i = 0; i < cards.length; i++)
				cards[i].classList.add("opase");
			el.classList.remove("opase");
			document.getElementById("addNewItem").setAttribute("onClick",
				"location.href='" + hyperLinks + "'");
			document.getElementById("addDiv").classList.remove("d-none");

			if (selectedItem) {
				selectedItem.classList.remove('selected');
			}
			card.classList.add('selected');
			selectedItem = card;
			document.getElementById("viewItems").innerText = '';
			var csrf_token = document.getElementById("csrf_token").value;

			var type = {
				'type': typeGiven,
				'source': 'home'
				//'_csrf': csrf_token
			};
			var cards = document.getElementsByClassName("table-button");
			for (var i = 0; i < cards.length; i++)
				cards[i].classList.remove("opase");
			for (var i = 0; i < cards.length; i++)
				cards[i].classList.add("opase");
			el.classList.remove("opase");
			select = document.getElementById("viewItems");

			var container = document.createElement("div");
			container.classList.add("container");

			var row = document.createElement("div");
			row.classList.add("row");

			$.ajax({
					type: "POST",
					url: "/getObjectsTypeWise",
					data: JSON.stringify(type),
					dataType: 'json',					
					beforeSend: function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
				},
				headers: {
				    'X-CSRF-TOKEN': csrfToken,
				    'X-XSRF-HEADER' : csrfHeader
				},
					contentType: "application/json",
					success: function (data) {
						for (let i = 0; i < data.length; i++) {
							//debugger;
							var col = document.createElement("div");
							col.classList.add("col");
							col.innerHTML = data[i].card_data;
							row.appendChild(col);

						}

						container.appendChild(row);
						select.appendChild(container);
					},
					error: function (xhr, textStatus, errorThrown) {
						if (xhr.status == 405) {
							alert("Not a valid request. Please try again");
							window.location.reload();
						}
					}
				});
		}

		function scrollItems(direction) {
			const container = document.querySelector('.items-container');
			const scrollAmount = container.clientWidth;

			if (direction === 'left') {
				container.scrollLeft -= scrollAmount;
			} else if (direction === 'right') {
				container.scrollLeft += scrollAmount;
			}
		}
	</script>
	<script>
		function searchBar() {
			//debugger;
			const searchBar = document.getElementById("searchBarInput");
			const searchQuery = searchBar.value.toLowerCase();
			const divs = document.querySelectorAll('.col'); // Replace '.item' with the actual class/attribute of your divs

			divs.forEach(div => {
				const content = div.textContent.toLowerCase();
				if (content.includes(searchQuery)) {
					div.style.display = 'block';
				} else {
					div.style.display = 'none';
				}
			});
		}
	</script>
	<script>
		function deleteObject(object_id, el) {
			showMessageBox('delete');
			var csrfToken = $('meta[name="_csrf"]').attr('content');
			var csrfHeader = $('meta[name="_csrf_header"]').attr('content');
			$('#messageBoxConfirmBtn').click(function () {
				var type = {
					'object_id': object_id
				};
				$.ajax({
					type: "POST",
					url: "/deleteObject",
					data: JSON.stringify(type),
					dataType: 'text',
					beforeSend: function(xhr) {
				xhr.setRequestHeader(csrfHeader, csrfToken);
				},
				headers: {
				    'X-CSRF-TOKEN': csrfToken,
				    'X-XSRF-HEADER' : csrfHeader
				},
					contentType: "application/json",
					success: function (data) {
						$(el).closest('.col').remove();
						showMessageBox('success');
					},
					error: function (xhr, textStatus, errorThrown) {
						if (xhr.status == 405) {
							alert("Not a valid request. Please try again");
							window.location.reload();
						}
					}
				});
			});
		}
	</script>

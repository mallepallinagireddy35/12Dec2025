<script>
	var cke = CKEDITOR.replace('editor', {
		toolbarGroups : [
				{
					name : 'clipboard',
					groups : [ 'clipboard', 'undo' ]
				},
				{
					name : 'editing',
					groups : [ 'find', 'selection', 'spellchecker', 'editing' ]
				},
				{
					name : 'links',
					groups : [ 'links' ]
				},
				{
					name : 'insert',
					groups : [ 'insert' ]
				},
				{
					name : 'forms',
					groups : [ 'forms' ]
				},
				{
					name : 'tools',
					groups : [ 'tools' ]
				},
				{
					name : 'document',
					groups : [ 'mode', 'document', 'doctools' ]
				},
				{
					name : 'others',
					groups : [ 'others' ]
				},
				{
					name : 'basicstyles',
					groups : [ 'basicstyles', 'cleanup' ]
				},
				{
					name : 'paragraph',
					groups : [ 'list', 'indent', 'blocks', 'align', 'bidi',
							'paragraph' ]
				}, {
					name : 'styles',
					groups : [ 'styles' ]
				}, {
					name : 'colors',
					groups : [ 'colors' ]
				} ],
		removeButtons : 'Subscript,Superscript,Source,Styles'
	});

	cke.on("instanceReady", function() {
		document.getElementById("cke_editor").setAttribute("style", "display:none;");
	});
</script>

<script>
	debugger;
         // create the back to top button
         $('body').prepend('<a href="#" class="back-to-top">Back to Top</a>');
         
         var amountScrolled = 300;
         
         $(window).scroll(function() {
             if ( $(window).scrollTop() > amountScrolled ) {
                 $('a.back-to-top').fadeIn('slow');
             } else {
                 $('a.back-to-top').fadeOut('slow');
             }
         });
         
         $('a.back-to-top, a.simple-back-to-top').click(function() {
             $('html, body').animate({
                 scrollTop: 0
             }, 700);
             return false;
         });
      </script>
